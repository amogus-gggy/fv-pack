[package]
name = "fv-passman"
version = "0.1.0"
edition = "2021"
description = "Simple encrypted password manager"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fv-passman"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
