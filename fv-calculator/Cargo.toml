[package]
name = "fv-calculator"
version = "0.1.0"
edition = "2021"
description = "Simple GTK calculator"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fv-calculator"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
dirs = "5"
serde_json = "1"
