[package]
name = "fv-calendar"
version = "0.1.0"
edition = "2021"
description = "Simple calendar with per-day notes"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fv-calendar"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
